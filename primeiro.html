<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Vida Pet - Cadastro</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }
    h1 {
      color: #007bff;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 8px 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Vida Pet - Cadastro</h1>

  <form>
    <h2>Dados do Tutor</h2>
    Nome Completo: <input type="text"><br><br>
    Telefone: <input type="tel"><br><br>

    <h2>Dados do Pet</h2>
    Nome do Pet: <input type="text"><br><br>
    Raça: <input type="text"><br><br>
    Idade (anos): <input type="number"><br><br>
    Observações:<br>
    <textarea rows="3" cols="30"></textarea><br><br>

    <button type="submit">Cadastrar</button>
  </form>

</body>
</html>
